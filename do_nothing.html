<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do Nothing</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: background 20s ease-in-out;
            cursor: default;
            user-select: none;
        }

        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            font-size: 14px;
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            z-index: 1000;
            backdrop-filter: blur(10px);
            padding: 8px 12px;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            transition: all 0.3s ease;
        }

        .back-link:hover {
            color: rgba(255,255,255,0.9);
            background: rgba(255,255,255,0.2);
        }

        .title {
            font-size: clamp(3rem, 12vw, 8rem);
            font-weight: 300;
            color: rgba(255,255,255,0.85);
            margin-bottom: 60px;
            opacity: 0.9;
            transition: all 8s ease-in-out;
        }

        .message {
            font-size: clamp(1.2rem, 4vw, 2rem);
            font-weight: 300;
            color: rgba(255,255,255,0.7);
            max-width: 500px;
            text-align: center;
            line-height: 1.5;
            opacity: 0;
            transform: translateY(20px);
            transition: all 12s ease-in-out;
        }

        .message.show {
            opacity: 0.8;
            transform: translateY(0);
        }

        .dot {
            width: 8px;
            height: 8px;
            background: rgba(255,255,255,0.6);
            border-radius: 50%;
            margin: 0 4px;
            display: inline-block;
            transition: all 2s ease-in-out;
        }

        @keyframes gentleFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-4px); }
        }

        .title.floating {
            animation: gentleFloat 6s ease-in-out infinite;
        }

        /* Color phases */
        .phase-1 {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 25%, #a8edea 50%, #fed6e3 75%, #d299c2 100%);
        }

        .phase-2 {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 25%, #d299c2 50%, #fef9d7 75%, #fedcba 100%);
        }

        .phase-3 {
            background: linear-gradient(135deg, #d299c2 0%, #fef9d7 25%, #fedcba 50%, #a0d2db 75%, #c0d8d0 100%);
        }

        .phase-4 {
            background: linear-gradient(135deg, #fef9d7 0%, #a0d2db 25%, #c0d8d0 50%, #ffecd2 75%, #fcb69f 100%);
        }

        @media (max-width: 480px) {
            body {
                padding: 20px;
            }
            
            .title {
                margin-bottom: 40px;
            }
        }
    </style>
</head>
<body class="phase-1">
    <a href="../index.html" class="back-link">← Back</a>
    
    <div class="title" id="title">Do Nothing</div>
    <div class="message" id="message"></div>

    <script>
        const messages = [
            "Still here.",
            "Nothing has changed.",
            "Time is passing.",
            "You don't need to do anything.",
            "Just being present.",
            "The moment holds.",
            "Quiet observation.",
            "No rush.",
            "Space to breathe.",
            "Enough as it is."
        ];

        const phases = ['phase-1', 'phase-2', 'phase-3', 'phase-4'];
        let currentPhase = 0;
        let currentMessage = 0;
        let startTime = Date.now();
        let messageTimer = null;
        let phaseTimer = null;

        const titleEl = document.getElementById('title');
        const messageEl = document.getElementById('message');

        function updateMessage() {
            messageEl.textContent = messages[currentMessage];
            messageEl.classList.add('show');
            
            currentMessage = (currentMessage + 1) % messages.length;
        }

        function changePhase() {
            document.body.className = phases[currentPhase];
            currentPhase = (currentPhase + 1) % phases.length;
        }

        function startExperience() {
            // Initial message after 3 seconds
            setTimeout(() => {
                updateMessage();
                messageTimer = setInterval(updateMessage, 15000);
            }, 3000);

            // Phase changes every 90 seconds
            phaseTimer = setInterval(changePhase, 90000);

            // Gentle title float after 10 seconds
            setTimeout(() => {
                titleEl.classList.add('floating');
            }, 10000);
        }

        // Gentle responsiveness to interaction (does nothing meaningful)
        document.addEventListener('click', (e) => {
            // Subtle ripple effect on click
            const ripple = document.createElement('div');
            ripple.style.cssText = `
                position: fixed;
                top: ${e.clientY - 10}px;
                left: ${e.clientX - 10}px;
                width: 20px;
                height: 20px;
                background: rgba(255,255,255,0.3);
                border-radius: 50%;
                pointer-events: none;
                z-index: 9999;
                animation: ripple 1s ease-out forwards;
            `;
            document.body.appendChild(ripple);
            
            setTimeout(() => ripple.remove(), 1000);
        });

        // Prevent scrolling
        document.addEventListener('wheel', (e) => e.preventDefault(), { passive: false });
        document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

        // CSS for ripple animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes ripple {
                0% {
                    transform: scale(0);
                    opacity: 1;
                }
                100% {
                    transform: scale(4);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);

        // Start when page loads
        window.addEventListener('load', startExperience);

        // Reset timers if user returns to page
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                startTime = Date.now();
            }
        });
    </script>
</body>
</html>

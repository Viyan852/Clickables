<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Are You a Scientist</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #fafbfc;
            color: #1f2937;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 650px;
            width: 100%;
        }

        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            font-size: 14px;
            color: #6b7280;
            text-decoration: none;
            z-index: 1000;
            opacity: 0.7;
            transition: opacity 0.3s;
        }

        .back-link:hover {
            opacity: 1;
        }

        .prompt {
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.6s ease;
        }

        .prompt.active {
            opacity: 1;
            transform: translateY(0);
        }

        .question {
            font-size: clamp(1.4rem, 4vw, 2rem);
            font-weight: 500;
            margin-bottom: 40px;
            color: #111827;
            line-height: 1.4;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 500px;
            margin: 0 auto;
        }

        .option {
            padding: 20px 24px;
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 16px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 400;
            transition: all 0.3s ease;
            user-select: none;
        }

        .option:hover {
            border-color: #3b82f6;
            background: #f8fafc;
            transform: translateY(-2px);
        }

        .option.selected {
            border-color: #10b981;
            background: #f0fdf4;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.15);
        }

        .result {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s ease;
        }

        .result.show {
            opacity: 1;
            transform: translateY(0);
        }

        .summary {
            font-size: 1.3rem;
            font-weight: 500;
            margin-bottom: 40px;
            color: #111827;
            line-height: 1.5;
        }

        .scientist-comparison {
            display: flex;
            flex-direction: column;
            gap: 24px;
            margin-top: 40px;
        }

        .scientist {
            background: white;
            padding: 28px;
            border-radius: 20px;
            border-left: 5px solid #e5e7eb;
            text-align: left;
            opacity: 0.8;
            transition: all 0.4s ease;
        }

        .scientist.primary {
            border-left-color: #3b82f6;
            opacity: 1;
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.15);
        }

        .scientist-name {
            font-size: 1.3rem;
            font-weight: 600;
            color: #111827;
            margin-bottom: 8px;
        }

        .scientist-desc {
            font-size: 1.1rem;
            color: #374151;
            line-height: 1.6;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 16px;
            }
            
            .question {
                margin-bottom: 32px;
            }
            
            .option {
                padding: 18px 20px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <a href="../index.html" class="back-link">← Back</a>
    
    <div class="container">
        <div class="prompts" id="prompts">
            <!-- Prompts will be generated by JS -->
        </div>
        
        <div class="result" id="result">
            <div class="summary" id="summary"></div>
            <div class="scientist-comparison" id="scientistComparison"></div>
        </div>
    </div>

    <script>
        const prompts = [
            {
                question: "When faced with a new phenomenon, you first:",
                options: [
                    "Build a mental picture of how it works",
                    "Collect detailed observations about it",
                    "Test simple explanations against it",
                    "Look for mathematical relationships",
                    "Trust your immediate intuition about it"
                ],
                scores: ['einstein', 'darwin', 'curie', 'feynman', 'newton']
            },
            {
                question: "A pattern appears unclear. You:",
                options: [
                    "Imagine the simplest model that fits",
                    "Gather more examples before deciding",
                    "Run small experiments to test ideas",
                    "Seek underlying mathematical structure",
                    "Follow what feels most natural"
                ],
                scores: ['feynman', 'darwin', 'curie', 'newton', 'einstein']
            },
            {
                question: "Estimating an unfamiliar quantity, you:",
                options: [
                    "Create a mental analogy from known systems",
                    "Break it into observable components",
                    "Make a rough guess and refine iteratively",
                    "Use formal scaling relationships",
                    "Go with your gut feeling"
                ],
                scores: ['einstein', 'darwin', 'curie', 'newton', 'feynman']
            },
            {
                question: "Ambiguous data appears. Your instinct:",
                options: [
                    "Visualize possible configurations",
                    "Document every variation carefully",
                    "Design a decisive experiment",
                    "Apply symmetry and pattern analysis",
                    "Simplify to the core truth"
                ],
                scores: ['einstein', 'darwin', 'curie', 'newton', 'feynman']
            },
            {
                question: "Complex system resists explanation. You:",
                options: [
                    "Build an abstract working model",
                    "Study it across many conditions",
                    "Isolate key variables experimentally",
                    "Derive governing equations",
                    "Find the intuitive principle"
                ],
                scores: ['einstein', 'darwin', 'curie', 'newton', 'feynman']
            },
            {
                question: "Discovery feels close but uncertain. You:",
                options: [
                    "Refine the conceptual framework",
                    "Expand the range of observations",
                    "Design the critical test",
                    "Formalize the relationships",
                    "Trust the simplifying insight"
                ],
                scores: ['einstein', 'darwin', 'curie', 'newton', 'feynman']
            },
            {
                question: "Reasoning through a problem, you prefer:",
                options: [
                    "Mental simulations and what-ifs",
                    "Systematic data accumulation",
                    "Controlled hypothesis testing",
                    "Mathematical deduction",
                    "Direct intuitive leaps"
                ],
                scores: ['einstein', 'darwin', 'curie', 'newton', 'feynman']
            },
            {
                question: "When intuition and calculation disagree:",
                options: [
                    "Trust the deeper conceptual picture",
                    "Collect more empirical evidence",
                    "Design experiment to resolve",
                    "Check mathematical derivation",
                    "Follow the intuitive clarity"
                ],
                scores: ['einstein', 'darwin', 'curie', 'newton', 'feynman']
            }
        ];

        const scientists = {
            einstein: {
                name: "Albert Einstein",
                desc: "approached problems through abstraction and mental modeling. He built vivid pictures of how the universe works before equations followed."
            },
            darwin: {
                name: "Charles Darwin",
                desc: "relied on patient observation across vast scales of time and variation. Patterns emerged from accumulated evidence."
            },
            curie: {
                name: "Marie Curie",
                desc: "pursued empirical investigation with relentless precision. Discovery came through controlled, decisive experiments."
            },
            feynman: {
                name: "Richard Feynman",
                desc: "simplified complex phenomena through intuition. He sought the core principle that made everything clear."
            },
            newton: {
                name: "Isaac Newton",
                desc: "recognized patterns and derived formal mathematical structures. Universal laws emerged from disciplined analysis."
            }
        };

        let currentPrompt = 0;
        let scores = {
            einstein: 0,
            darwin: 0,
            curie: 0,
            feynman: 0,
            newton: 0
        };
        let selectedOptions = [];

        const elements = {
            prompts: document.getElementById('prompts'),
            result: document.getElementById('result'),
            summary: document.getElementById('summary'),
            scientistComparison: document.getElementById('scientistComparison')
        };

        function createPrompt(index) {
            const prompt = prompts[index];
            const div = document.createElement('div');
            div.className = 'prompt';
            div.innerHTML = `
                <div class="question">${prompt.question}</div>
                <div class="options"></div>
            `;
            
            const optionsContainer = div.querySelector('.options');
            prompt.options.forEach((option, optIndex) => {
                const optionEl = document.createElement('div');
                optionEl.className = 'option';
                optionEl.textContent = option;
                optionEl.addEventListener('click', () => selectOption(index, optIndex));
                optionsContainer.appendChild(optionEl);
            });
            
            return div;
        }

        function selectOption(promptIndex, optionIndex) {
            const promptEl = elements.prompts.children[promptIndex];
            const options = promptEl.querySelectorAll('.option');
            
            // Deselect all, select current
            options.forEach(opt => opt.classList.remove('selected'));
            options[optionIndex].classList.add('selected');
            
            // Record score
            const scoreKey = prompts[promptIndex].scores[optionIndex];
            scores[scoreKey]++;
            selectedOptions[promptIndex] = optionIndex;
            
            // Advance after short delay
            setTimeout(() => {
                if (currentPrompt < prompts.length - 1) {
                    promptEl.classList.remove('active');
                    currentPrompt++;
                    elements.prompts.children[currentPrompt].classList.add('active');
                } else {
                    showResult();
                }
            }, 400);
        }

        function getDominantTendencies() {
            const maxScore = Math.max(...Object.values(scores));
            const topScientists = Object.entries(scores)
                .filter(([_, score]) => score === maxScore)
                .map(([scientist]) => scientist);
            
            return { maxScore, topScientists };
        }

        function showResult() {
            elements.prompts.style.display = 'none';
            elements.result.classList.add('show');
            
            const { topScientists } = getDominantTendencies();
            const primaryScientist = topScientists[0];
            
            // Summary based on dominant tendencies
            const tendencyDescriptions = {
                einstein: "abstraction and mental modeling",
                darwin: "patient observation and incremental reasoning", 
                curie: "empirical investigation and persistence",
                feynman: "intuitive simplification",
                newton: "pattern recognition and formal structure"
            };
            
            const summaryText = `Your responses leaned toward ${tendencyDescriptions[primaryScientist]}.
This way of approaching problems shares characteristics with certain scientific thinking styles.`;
            
            elements.summary.textContent = summaryText;
            
            // Create scientist comparisons
            Object.entries(scientists).forEach(([key, data]) => {
                const div = document.createElement('div');
                div.className = `scientist ${key === primaryScientist ? 'primary' : ''}`;
                div.innerHTML = `
                    <div class="scientist-name">${data.name}</div>
                    <div class="scientist-desc">${data.desc}</div>
                `;
                elements.scientistComparison.appendChild(div);
            });
        }

        // Initialize
        prompts.forEach((_, index) => {
            const promptEl = createPrompt(index);
            elements.prompts.appendChild(promptEl);
        });
        
        // Show first prompt
        elements.prompts.children[0].classList.add('active');
    </script>
</body>
</html>
